name: AudioBy
options:
  bundleIdPrefix: com.audioby
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  AudioBy:
    type: application
    platform: iOS
    sources:
      - path: AudioBy
        excludes:
          - "**/.DS_Store"
    info:
      path: AudioBy/Resources/Info.plist
      properties:
        CFBundleDisplayName: AudioBy
        CFBundleIdentifier: com.audioby.app
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_NAME: AudioBy
        PRODUCT_BUNDLE_IDENTIFIER: com.audioby.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AudioBy/Resources/Info.plist

  AudioByTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AudioByTests
    dependencies:
      - target: AudioBy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audioby.tests
        GENERATE_INFOPLIST_FILE: YES
