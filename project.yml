name: AudioBy
options:
  bundleIdPrefix: com.audioby
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.24.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.18.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    SDKROOT: iphonesimulator
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"

targets:
  AudioBy:
    type: application
    platform: iOS
    sources:
      - path: AudioBy
        excludes:
          - "**/.DS_Store"
          - "Config/*.xcconfig"
    info:
      path: AudioBy/Resources/Info.plist
      properties:
        CFBundleDisplayName: AudioBy
        CFBundleIdentifier: com.audioby.app
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        FirebaseAppDelegateProxyEnabled: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ELEVENLABS_API_KEY: "$(ELEVENLABS_API_KEY)"
        CATALOG_SQLITE_URL: "$(CATALOG_SQLITE_URL)"
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        GIDClientID: "$(GID_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"
    configFiles:
      Debug: AudioBy/Config/Config.xcconfig
      Release: AudioBy/Config/Config.xcconfig
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_NAME: AudioBy
        PRODUCT_BUNDLE_IDENTIFIER: com.audioby.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AudioBy/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AudioBy/Resources/AudioBy.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        SDKROOT: iphonesimulator
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"

  AudioByTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AudioByTests
    dependencies:
      - target: AudioBy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audioby.tests
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: iphonesimulator
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
